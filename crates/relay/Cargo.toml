[package]
name = "bouncer-relay"
description = "Hook relay between Claude Code and the Bouncer app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# std + serde_json, plus windows-sys on Windows for the pipe ACL and peer checks.
[dependencies]
serde_json = "1.0.151"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[[bin]]
name = "bouncer-hook"
path = "src/main.rs"

[dev-dependencies]
bouncer-core = { path = "../core" }
