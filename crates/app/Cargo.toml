[package]
name = "bouncer-app"
description = "Bouncer desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
bouncer-core = { path = "../core" }
serde_json = "1.0.151"
tauri = { version = "2.12.1", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-updater = { version = "=2.13.3", default-features = false, features = ["native-tls"] }
