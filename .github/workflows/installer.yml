name: Installer test

# The installer end to end on a fresh runner (a disposable machine: it
# installs, uninstalls and deletes Bouncer's data folders). Two test builds of
# this commit, 0.0.1 and 0.0.2, so the upgrade goes through "uninstall before
# installing". Runs on PRs that touch the installer, from the release workflow
# before anything is built for real, and by hand. The `mac` job does the same
# for the .dmg, one universal test build (PLAN, "Roadmap g").
on:
  pull_request:
    paths:
      - crates/app/installer-hooks.nsh
      - crates/app/tauri.conf.json
      - crates/app/tauri.release.json
      - crates/core/src/bin/**
      - crates/core/src/autostart.rs
      - crates/core/src/hooks.rs
      - scripts/bundle.mjs
      - scripts/version.mjs
      - scripts/installer-test.ps1
      - scripts/installer-test-mac.sh
      - scripts/check-mac-bundle.sh
      - .github/workflows/installer.yml
      - .github/workflows/release.yml
  workflow_call:
    inputs:
      windows_only:
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: npm ci
      - name: Build test version 0.0.1
        shell: bash
        run: |
          node scripts/version.mjs set 0.0.1
          node scripts/bundle.mjs
          node scripts/version.mjs check 0.0.1 target/release/bundle/nsis
          mv target/release/bundle/nsis/Bouncer_0.0.1_x64-setup.exe "$RUNNER_TEMP/old-setup.exe"
      - name: Build test version 0.0.2
        shell: bash
        run: |
          node scripts/version.mjs set 0.0.2
          node scripts/bundle.mjs
          node scripts/version.mjs check 0.0.2 target/release/bundle/nsis
          mv target/release/bundle/nsis/Bouncer_0.0.2_x64-setup.exe "$RUNNER_TEMP/new-setup.exe"
      - name: Install, use, upgrade, uninstall
        shell: powershell
        run: >
          ./scripts/installer-test.ps1
          -Old "$env:RUNNER_TEMP\old-setup.exe" -OldVersion 0.0.1
          -New "$env:RUNNER_TEMP\new-setup.exe" -NewVersion 0.0.2
          -Fixtures crates\relay\tests\fixtures

  mac:
    if: inputs.windows_only != true
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: rustup toolchain install stable --profile minimal --target aarch64-apple-darwin --target x86_64-apple-darwin && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: npm ci
      - name: Build test version 0.0.1
        run: |
          node scripts/version.mjs set 0.0.1
          node scripts/bundle.mjs --universal
          node scripts/version.mjs check 0.0.1 target/universal-apple-darwin/release/bundle/dmg
      - name: Check the bundle
        run: bash scripts/check-mac-bundle.sh target/universal-apple-darwin/release/bundle 0.0.1
      - name: Install, use, uninstall
        run: >
          bash scripts/installer-test-mac.sh
          target/universal-apple-darwin/release/bundle/dmg/Bouncer_0.0.1_universal.dmg
          crates/relay/tests/fixtures
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-installer
          path: |
            island-*.png
            app-*.log
          if-no-files-found: warn
